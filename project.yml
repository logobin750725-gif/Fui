name: ConsensusSuite
options:
  bundleIdPrefix: com.logobin.consensus
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
targets:
  ConsensusPro:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.logobin.consensus.pro
        PRODUCT_NAME: ConsensusPro
        INFOPLIST_KEY_CFBundleDisplayName: Consensus Pro
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  ConsensusUltra:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.logobin.consensus.ultra
        PRODUCT_NAME: ConsensusUltra
        INFOPLIST_KEY_CFBundleDisplayName: Consensus Ultra
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
schemes:
  ConsensusPro:
    build:
      targets:
        ConsensusPro: all
  ConsensusUltra:
    build:
      targets:
        ConsensusUltra: all
